name: Unit, Integration & E2E Tests
on:
  push:
    branches: [ main, master ]
    paths: [ 'client/**', 'server/**', '.github/workflows/unit-integration-e2e-tests.yml' ]
  pull_request:
    branches: [ main, master ]
    paths: [ 'client/**', 'server/**', '.github/workflows/unit-integration-e2e-tests.yml' ]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  # A newer push supersedes an older one - no point letting a stale run keep
  # burning CI time (and racing to deploy Pages) once a fresher commit exists.
  cancel-in-progress: true
jobs:
  unit-tests:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: lts/*
        cache: npm
        cache-dependency-path: |
          client/package-lock.json
          server/package-lock.json
    - name: Install client dependencies
      working-directory: client
      run: npm ci
    - name: Install server dependencies
      working-directory: server
      run: npm ci
    - name: Configure client environment
      # client/.env is gitignored, so it doesn't exist on a fresh checkout.
      # Without VITE_API_URL, RTK Query builds relative URLs (e.g. /users/1),
      # which Node's fetch can't resolve (no page origin like a browser has) -
      # it throws before MSW's mocks even get a chance to intercept.
      working-directory: client
      run: echo "VITE_API_URL=http://localhost:8888" > .env
    - name: Run client unit tests
      working-directory: client
      run: npm test
    - name: Run server unit/integration tests
      # STRIPE_KEY: routes/stripeRouter.ts constructs `new Stripe(...)` at
      # import time, which server.ts pulls in - so it throws for every test
      # file that imports server.ts (not just Stripe-related ones), even
      # though only stripeRouter.test.ts actually exercises Stripe (and that
      # file mocks the SDK entirely). A dummy value is enough since nothing
      # else makes a real Stripe call.
      working-directory: server
      env:
        STRIPE_KEY: sk_test_dummy_key_for_ci
      run: npm test

  e2e:
    needs: unit-tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: lts/*
        cache: npm
        cache-dependency-path: |
          client/package-lock.json
          server/package-lock.json
    - name: Install client dependencies
      run: npm ci
    - name: Install server dependencies
      working-directory: server
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Start MongoDB
      # A single-node replica set, not a plain standalone: the register
      # endpoint uses a session transaction, which Mongo only allows on a
      # replica set member. Pinned to the commit behind the 1.12.1 tag
      # (not the mutable tag itself) so a repointed tag can't silently
      # change what runs here.
      uses: supercharge/mongodb-github-action@315db7fe45ac2880b7758f1933e6e5d59afd5e94
      with:
        mongodb-version: '7.0'
        mongodb-replica-set: rs0
    - name: Seed shoe catalog fixture
      # Real e2e coverage needs real products to browse/filter/sort/buy - a
      # fresh MongoDB starts with none, so restore a diverse ~80-shoe sample
      # exported from local dev (client/e2e/fixtures/data/shoes.json). Runs
      # mongoimport from a throwaway container against the Mongo instance
      # the action above already started on localhost:27017.
      run: |
        docker run --rm --network host \
          -v "${{ github.workspace }}/client/e2e/fixtures/data:/fixture" \
          mongo:7 mongoimport --uri="mongodb://localhost:27017/shoe-shop" --collection=shoes --jsonArray --file=/fixture/shoes.json
    - name: Configure server environment
      working-directory: server
      run: |
        cat <<EOF > .env.local
        ATLAS_URI=mongodb://localhost:27017/shoe-shop
        JWT_SEC=${{ secrets.CI_JWT_SEC || 'ci-test-jwt-secret' }}
        PASS_SEC=${{ secrets.CI_PASS_SEC || 'ci-test-pass-secret' }}
        STRIPE_KEY=${{ secrets.STRIPE_SECRET_KEY_TEST }}
        NODE_ENV=test
        EOF
    - name: Configure client environment
      run: |
        cat <<EOF > .env
        VITE_API_URL=http://localhost:8888
        VITE_CLIENT_URL=http://localhost:5173
        VITE_STRIPE=${{ secrets.STRIPE_PUBLISHABLE_KEY_TEST }}
        EOF
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: client/playwright-report/
        retention-days: 30
    - name: Upload Pages artifact
      if: ${{ !cancelled() && github.event_name == 'push' }}
      uses: actions/upload-pages-artifact@v5
      with:
        path: client/playwright-report
    - name: Deploy to GitHub Pages
      if: ${{ !cancelled() && github.event_name == 'push' }}
      id: deployment
      uses: actions/deploy-pages@v5
    - name: Add report link to summary
      if: ${{ !cancelled() && github.event_name == 'push' }}
      run: echo "### 📊 [View Playwright Report](${{ steps.deployment.outputs.page_url }})" >> $GITHUB_STEP_SUMMARY
